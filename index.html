<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Marth | Real Estate Agent</title>
    <style>
        /* --- General Reset & Styling --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #3b2f2f; /* Dark espresso brown text */
            background-color: #f5f2eb; /* Warm, earthy cream background */
        }
        
        /* --- Header / Hero Section --- */
        header {
            background-color: #2b4231; /* Deep Forest Green */
            color: #fdfbf7;
            padding: 80px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        header p {
            font-size: 1.2rem;
            color: #cdd5d0; /* Soft muted sage for subtitle */
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Main Services Section --- */
        .services-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        .services-section h2 {
            font-size: 2rem;
            margin-bottom: 40px;
            color: #3b2f2f; /* Dark espresso brown */
        }

        /* Flexbox for the 3 columns */
        .services-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }

        /* --- Individual Service Cards --- */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            flex: 1 1 calc(33.333% - 30px);
            min-width: 300px; 
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #2b4231; /* Deep Forest Green to tie in the header */
        }
        .card p {
            color: #5a504b; /* Softer brown-gray for readability */
            margin-bottom: 25px;
            flex-grow: 1; 
        }

        /* --- Buttons --- */
        .btn {
            display: inline-block;
            background-color: #8b5e34; /* Earthy wood/clay brown */
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #6a4625; /* Darker brown on hover */
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #2b4231; /* Deep Forest Green */
            color: #cdd5d0;
            margin-top: 40px;
        }
        .footer-contact {
            margin-bottom: 20px;
        }
        .footer-contact p {
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #fdfbf7;
        }
        .footer-contact a {
            color: #e3d5ca; /* Warm sand color to pop against the green */
            text-decoration: none;
        }
        .footer-contact a:hover {
            text-decoration: underline;
        }
        .footer-disclosure {
            max-width: 900px;
            margin: 0 auto 20px auto;
            font-size: 0.8rem;
            color: #9aa89e; /* Muted sage to recede slightly */
            line-height: 1.5;
            text-align: justify;
            text-align-last: center; 
        }
        .copyright {
            font-size: 0.9rem;
            color: #7b8a80;
            margin-top: 20px;
            border-top: 1px solid #3c5443;
            padding-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
