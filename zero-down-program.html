<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Down Program | Andrew Marth Real Estate</title>
    <style>
        /* --- General Reset & Styling --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #4f2d2c; 
            background-color: #e9e2d8; 
            overflow-x: hidden; 
        }
        
        /* --- Navigation Bar (Fixed & Glassmorphism) --- */
        .navbar {
            background: rgba(233, 226, 216, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000; 
            
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(153, 114, 75, 0.3); 
            min-height: 80px;
        }
        .mobile-center-logo {
            display: none; 
        }
        .hamburger {
            display: none;
            font-size: 2rem;
            background: none;
            border: none;
            color: #4e513e; 
            cursor: pointer;
        }
        .nav-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-logo img {
            height: 50px; 
            width: auto;
            display: block;
            border-radius: 4px;
        }
        .nav-logo a {
            text-decoration: none; 
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .nav-links a {
            text-decoration: none;
            color: #4f2d2c; 
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #9a5d40; 
        }
        .close-menu {
            display: none; 
        }

        /* --- Header / Hero Section --- */
        header {
            background: linear-gradient(rgba(78, 81, 62, 0.75), rgba(78, 81, 62, 0.75)), url('https://andrewmarth.com/images/background.jpeg');
            background-size: cover;
            background-position: center;
            color: #e9e2d8; 
            padding: 160px 20px 100px 20px; 
            text-align: center;
        }
        header h1 {
            font-size: 3rem; 
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
        }
        header p {
            font-size: 1.3rem;
            color: #e9e2d8; 
            opacity: 0.95; 
            max-width: 700px;
            margin: 0 auto;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* --- Intro Section --- */
        .intro-section {
            max-width: 900px;
            margin: 60px auto 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .intro-section h2 {
            font-size: 2.2rem;
            color: #4f2d2c;
            margin-bottom: 20px;
        }
        .intro-section p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        /* --- Single Comprehensive Program Card Section --- */
        .program-details-section {
            display: flex;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
        }
        .program-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 50px;
            width: 100%;
            max-width: 800px; /* Keeps the text lines at a readable length */
            border-top: 4px solid #4e513e;
        }
        .detail-item {
            margin-bottom: 35px;
        }
        .detail-item:last-child {
            margin-bottom: 0;
        }
        .detail-item h3 {
            color: #4e513e;
            margin-bottom: 8px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(153, 114, 75, 0.2);
            padding-bottom: 5px;
        }
        .detail-item p {
            color: #4f2d2c;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        /* --- Call to Action Section --- */
        .cta-section {
            max-width: 800px;
            margin: 0 auto 80px auto; 
            padding: 40px 20px;
            text-align: center;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #99724b; 
        }
        .cta-section h2 {
            font-size: 2rem;
            color: #4f2d2c;
            margin-bottom: 15px;
        }
        .cta-section p {
            font-size: 1.1rem;
            color: #4f2d2c;
            margin-bottom: 30px;
        }
        .cta-btn {
            display: inline-block;
            padding: 15px 35px;
            background-color: #99724b; 
            color: #e9e2d8;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.3s;
        }
        .cta-btn:hover {
            background-color: #9a5d40; 
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #4e513e; 
            color: #e9e2d8; 
        }
        .footer-contact {
            margin-bottom: 20px;
        }
        .footer-contact p {
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #e9e2d8;
        }
        .footer-contact a {
            color: #c09050; 
            text-decoration: none;
            font-weight: bold;
        }
        .footer-contact a:hover {
            text-decoration: underline;
        }
        .footer-disclosure {
            max-width: 900px;
            margin: 0 auto 0 auto; 
            font-size: 0.8rem;
            color: #e9e2d8; 
            opacity: 0.75;
            line-height: 1.5;
            text-align: justify;
            text-align-last: center; 
        }

            .navbar {
                justify-content: flex-end; 
            }
            .mobile-center-logo {
                display: block;

            }
            .mobile-center-logo img {
                height: 40px;

                transition: right 0.3s ease;
                z-index: 1001; 
            }

                right: 0;
